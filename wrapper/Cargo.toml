[package]
name = "csqtt-ctl"
version = "1.2.0"
edition = "2021"
rust-version = "1.85"
description = "CSQTT OpenWrt supervisor: UCI, TUN, failover pool, CAPTCHA helper"
license = "MIT"
publish = false

[[bin]]
name = "csqtt"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "aws-lc-rs"] }
webpki-roots = "0.26"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
